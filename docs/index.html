<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EEF1FB" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#13132B" media="(prefers-color-scheme: dark)"><meta name="description" content="Çocukların kendi kahramanını seçip masala yön verdiği interaktif masal uygulaması."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Masal Fabrikası"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Akıllı Masal Fabrikası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one narrow column like a picture book; a toy-like sticky action bar at the bottom of each wizard step. */
:root{
  --bg:#EEF1FB; --surface:#FFFFFF; --ink:#221F45; --muted:#5E5987; --line:#D8DAF0;
  --accent:#FF7A30; --accent-deep:#D2581A; --accent-ink:#FFFFFF; --accent-soft:#FFE7D7;
  --leaf:#178F75; --leaf-soft:#DDF4EC; --sun:#FFC928; --sun-soft:#FFF2C2; --sky:#4B63F0;
  --chip-on:#221F45; --chip-on-ink:#FFFFFF; --danger:#C8323C; --sil-bg:#E3E0F7;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-read:"Andika","Nunito",system-ui,sans-serif;
  --r-lg:24px; --r-md:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13132B; --surface:#1F1E42; --ink:#F2EFFF; --muted:#ADA8D8; --line:#363463;
  --accent:#FF8C4A; --accent-deep:#B5501A; --accent-ink:#1B1030; --accent-soft:#3D2A3A;
  --leaf:#4FD1B0; --leaf-soft:#173A36; --sun:#FFD248; --sun-soft:#3A3418; --sky:#8C9BFF;
  --chip-on:#FFD248; --chip-on-ink:#1B1030; --danger:#FF6B74; --sil-bg:#CEC9F0; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13132B; --surface:#1F1E42; --ink:#F2EFFF; --muted:#ADA8D8; --line:#363463;
  --accent:#FF8C4A; --accent-deep:#B5501A; --accent-ink:#1B1030; --accent-soft:#3D2A3A;
  --leaf:#4FD1B0; --leaf-soft:#173A36; --sun:#FFD248; --sun-soft:#3A3418; --sky:#8C9BFF;
  --chip-on:#FFD248; --chip-on-ink:#1B1030; --danger:#FF6B74; --sil-bg:#CEC9F0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;font-family:var(--font-display);font-weight:800;font-size:1.15rem;white-space:nowrap;min-width:0}
@media (max-width:420px){ .top-actions .pill{display:none} }
.lang{display:flex;border:2px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.lang button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;min-height:36px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.brand .gear{display:inline-block;font-size:1.3rem}
.top-actions{display:flex;gap:8px;align-items:center}
.pill{font-size:.75rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--surface);border:2px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ai{border-color:var(--leaf);color:var(--leaf)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-bottom:10px}
.step{display:flex;flex-direction:column;gap:4px;font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.03em}
.step i{display:block;height:8px;border-radius:99px;background:var(--line)}
.step.on{color:var(--ink)} .step.on i{background:var(--accent)}
.step.done i{background:var(--leaf)}

main{padding-block:8px 140px}
main.nobar{padding-bottom:48px}
.screen{display:flex;flex-direction:column;gap:22px}
.lead h1{font-size:clamp(1.8rem,7vw,2.3rem)}
.lead p{margin:6px 0 0;color:var(--muted);font-size:1.02rem}
.section{display:flex;flex-direction:column;gap:10px}
.section h2{font-size:1.3rem}
.label{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-md);padding:14px 22px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s;min-height:54px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{min-height:42px;padding:8px 14px;font-size:1rem;border-radius:14px}
.btn.wide{width:100%}
.btn.icon{min-width:54px;padding:0 12px;font-size:1.4rem}
.btn.listening{background:var(--danger);box-shadow:0 4px 0 var(--accent-deep);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* picks */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.grid2.worlds{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px 12px;border-radius:var(--r-lg);border:3px solid var(--line);background:var(--surface);text-align:center;font-weight:800;font-size:.95rem;line-height:1.2;min-width:0}
.pick .em{font-size:2.6rem;line-height:1.1}
.pick small{display:block;font-weight:600;color:var(--muted);font-size:.78rem}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.8rem;display:grid;place-items:center}
.world .em{font-size:2.2rem}
.world{padding:12px 8px;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:800;font-size:.98rem;min-height:44px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.sw{width:48px;height:48px;border-radius:50%;border:4px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.field{display:flex;gap:8px;align-items:stretch}
.field input{flex:1;min-width:0;border:3px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;font-size:1.15rem;font-weight:700}
.field input:focus{border-color:var(--sky);outline:none}
.hint{font-size:.88rem;color:var(--muted);margin:0}

/* action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.bar .row{display:flex;gap:10px;align-items:center}
.bar .row .btn:last-child{flex:1}
.bar .why{font-size:.85rem;color:var(--muted);margin:0 0 8px;text-align:center}

/* home */
.factory{position:relative;overflow:hidden;border-radius:28px;background:var(--surface);border:3px solid var(--line);padding:22px 18px 0;display:flex;flex-direction:column;gap:10px}
.factory h1{font-size:clamp(2.1rem,9vw,2.9rem);letter-spacing:-.01em}
.factory h1 span{color:var(--accent)}
.factory p{margin:0;color:var(--muted);font-size:1.05rem;max-width:34ch}
.factory .btn{align-self:flex-start;margin-top:6px}
.belt{position:relative;margin:14px -18px 0;height:92px;border-top:3px dashed var(--line);overflow:hidden}
.belt-track{position:absolute;bottom:22px;display:flex;gap:28px;font-size:2.4rem;white-space:nowrap;animation:belt 18s linear infinite}
.belt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 26px);animation:roll 1.2s linear infinite}
.belt .book{position:absolute;right:12px;bottom:20px;font-size:2.8rem;z-index:2;filter:drop-shadow(-12px 0 10px var(--surface))}
@keyframes belt{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes roll{from{background-position:0 0}to{background-position:26px 0}}
.spin{display:inline-block;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.shelf{display:flex;flex-direction:column;gap:10px}
.book-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.book-card .cover{width:54px;height:54px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:1.9rem}
.book-card .meta{flex:1;min-width:0}
.book-card b{display:block;font-family:var(--font-display);font-size:1.08rem;line-height:1.2}
.book-card span{font-size:.85rem;color:var(--muted)}
.book-card .open{background:none;border:0;padding:0;text-align:left;display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--sun-soft);color:var(--ink);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.del{background:none;border:0;color:var(--muted);font-weight:800;font-size:.85rem;padding:8px;border-radius:10px;white-space:nowrap}
.del.sure{color:var(--danger);background:var(--accent-soft)}
.empty{border:2px dashed var(--line);border-radius:var(--r-md);padding:16px;color:var(--muted);text-align:center;margin:0}

.parents{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.parents ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.parents li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.parents li b{display:block}
.parents li span{color:var(--muted);font-size:.93rem}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px}

/* story */
.story-head{display:flex;flex-direction:column;gap:6px}
.story-head h1{font-size:clamp(1.7rem,7vw,2.3rem)}
.story-head .sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 12px;min-height:40px}
.toggle[aria-pressed="true"]{border-color:var(--leaf);color:var(--leaf)}
.chapter{display:flex;flex-direction:column;gap:14px;scroll-margin-top:130px}
.scene{position:relative;aspect-ratio:16/8;max-width:100%;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,26px);overflow:hidden}
.scene .e{font-size:clamp(2.6rem,13vw,4.2rem);line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.scene .e.hero{animation:bob 3s ease-in-out infinite}
.scene .glow{position:absolute;width:44%;aspect-ratio:1;border-radius:50%;opacity:.45;filter:blur(24px)}
@keyframes bob{50%{transform:translateY(-8px)}}
.scene .num{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--ink);font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.picked{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;background:var(--chip-on);color:var(--chip-on-ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.92rem}
.cause{border:2px dashed var(--leaf);background:var(--leaf-soft);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.cause .label{color:var(--leaf)}
.cause p{margin:0;font-weight:700}
.read{font-family:var(--font-read);font-size:1.24rem;line-height:1.75;max-width:62ch}
.read p{margin:0 0 .8em}
.read p:last-child{margin-bottom:0}
.chapter-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.word{display:flex;flex-direction:column;gap:2px;background:var(--sun-soft);border-radius:var(--r-md);padding:10px 14px}
.word b{font-family:var(--font-display);font-size:1.2rem}
.word span{font-size:.95rem}
.divider{height:0;border-top:3px dotted var(--line);margin:6px 0}

.ask{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:3px solid var(--line);border-radius:var(--r-lg);padding:16px}
.ask h2{font-size:1.35rem}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:grid;grid-template-columns:34px 44px 1fr;align-items:center;gap:6px;text-align:left;background:var(--bg);border:3px solid var(--line);border-radius:var(--r-md);padding:10px 12px;font-family:var(--font-display);font-weight:700;font-size:1.12rem;line-height:1.2;box-shadow:0 4px 0 var(--line);min-height:64px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.9rem}
.choice .ce{font-size:1.9rem}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:.85rem}
.or::before,.or::after{content:"";flex:1;border-top:2px solid var(--line)}

.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 16px;background:var(--surface);border:3px dashed var(--line);border-radius:var(--r-lg);text-align:center}
.gears{font-size:2.6rem;display:flex;gap:2px}
.gears span:nth-child(2){animation-direction:reverse;font-size:1.8rem;margin-top:22px}
.loading p{margin:0;font-weight:800;font-family:var(--font-display);font-size:1.15rem}

.end{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:3px solid var(--accent);border-radius:var(--r-lg);padding:18px}
.end .moral{font-family:var(--font-display);font-size:1.35rem;font-weight:700;line-height:1.25;margin:0}
.end ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:1.05rem}
.end .row{display:flex;flex-wrap:wrap;gap:10px}
.end .row .btn{flex:1 1 200px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:min(92vw,460px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;font-size:.95rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* bulmaca molası */
.pz{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:3px solid var(--sky);border-radius:var(--r-lg);padding:16px;scroll-margin-top:130px}
.pz .label{color:var(--sky)}
.pz-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pz-top h2{font-size:1.35rem}
.pz-top p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.pz-stage{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px;font-size:2.3rem;line-height:1.15;padding:14px 10px;background:var(--bg);border-radius:var(--r-md);text-align:center}
.pz-stage.text{font-family:var(--font-read);font-size:1.2rem;line-height:1.5}
.pz-stage .q{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:12px;border:3px dashed var(--sky);font-size:.8em;color:var(--sky);font-family:var(--font-display);font-weight:800}
.pz-stage .op{font-family:var(--font-display);font-weight:800;color:var(--muted);font-size:.8em}
.pz-stage .big{font-size:1.5em}
.pz-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:10px}
.pz-opts.wide{grid-template-columns:1fr}
.pz-opt{display:flex;align-items:center;justify-content:center;gap:10px;min-height:66px;padding:8px 10px;border-radius:var(--r-md);border:3px solid var(--line);background:var(--bg);box-shadow:0 4px 0 var(--line);font-family:var(--font-display);font-weight:800;font-size:1.9rem;line-height:1.15}
.pz-opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pz-opt.txt{font-size:1.1rem;justify-content:flex-start;text-align:left}
.pz-opt.txt .oe{font-size:1.7rem}
.pz-opt[disabled]{opacity:.35;box-shadow:none;cursor:default;transform:none}
.pz-opt.sil{background:var(--sil-bg)}
.pz-opt.sil span{filter:brightness(0);opacity:.85}
.mem{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:8px}
.card{aspect-ratio:1;max-width:100%;border-radius:14px;border:3px solid var(--accent-deep);background:var(--accent);color:var(--accent-ink);font-size:clamp(1.5rem,8vw,2.2rem);display:grid;place-items:center;padding:0}
.card.up{background:var(--surface);border-color:var(--sky)}
.card.done{background:var(--leaf-soft);border-color:var(--leaf)}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.seq .slot{display:grid;place-items:center;min-width:52px;height:52px;padding:0 6px;border-radius:12px;border:3px dashed var(--line);font-size:1.6rem;font-family:var(--font-display);font-weight:800}
.seq .slot.on{border-style:solid;border-color:var(--leaf);background:var(--leaf-soft)}
.seq .slot.miss{border-color:var(--sky);color:var(--sky)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:52px;height:56px;padding:0 10px;border-radius:14px;border:3px solid var(--line);background:var(--bg);box-shadow:0 4px 0 var(--line);font-family:var(--font-display);font-weight:800;font-size:1.6rem}
.tile.step{display:flex;align-items:center;gap:8px;font-size:1.05rem;text-align:left;min-height:62px;height:auto;width:100%}
.tile.step .oe{font-size:1.7rem}
.tile[disabled]{opacity:.3;box-shadow:none}
.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pz-hint{margin:0;font-size:.95rem;color:var(--muted)}
.pz-hint b{color:var(--ink)}
.pz-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.pz-win{display:flex;align-items:center;gap:12px;background:var(--leaf-soft);border:2px solid var(--leaf);border-radius:var(--r-md);padding:12px 14px;font-weight:800}
.pz-win .burst{font-size:2.2rem;animation:pop .5s ease-out}
.pz-win small{display:block;font-weight:700;color:var(--muted)}
@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.pz-chip{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;background:var(--leaf-soft);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.85rem}
.pz-chip.skip{background:var(--bg);color:var(--muted);border:2px solid var(--line)}
.stars{font-size:1.6rem;letter-spacing:2px}

@media (prefers-reduced-motion: reduce){

function traitText(t, lang){ if (!t.length) return lang === "en" ? "cheerful" : "neşeli"; return t.length === 1 ? t[0] : t[0] + (lang === "en" ? " and " : " ve ") + t[1]; }

    scene = [h.e, w.itemE, w.obstacleE];

      power:[`${nm} took a deep breath and ${P.use}. One, two, three… ${nm} was safely across!`,
        `You chose to use the superpower. Because ${nm} ${P.because}, ${nm} got past the obstacle.`, {w:"obstacle", m:"Something in our way that we need to get past."}],
      friends:[`${nm} called out loudly: "Can anyone help me?" In a flash, ${w.friends} came running. They all worked together, hand in hand, and got past the obstacle as a team.`,
        `You chose to ask for help. Because everyone worked together, the hard job became easy.`, {w:"teamwork", m:"Working together to get something done."}],
      think:[`${nm} sat down on a rock and thought and thought… Then a bright idea popped up! Thanks to the ${w.itemN}, ${nm} found a way past the obstacle.`,
        `You chose to make a plan. Because ${nm} stayed calm and thought it through, ${nm} found the answer.`, {w:"plan", m:"Thinking ahead about how to do something."}],
      custom:[`${nm} tried your idea: "${idea}". Everyone was amazed, because it was just what was needed to get past the obstacle!`,
        `You shared your own idea: "${idea}". So ${nm} got past the obstacle in a very special way.`, {w:"creative", m:"Good at thinking of new and different ideas."}]
    }[kind] || [`${nm} carefully got past the obstacle.`, "", {w:"obstacle", m:"Something in our way that we need to get past."}];
    text = p[0] + `\n\nAt last, ${nm} reached ${w.goal}. But waiting there was ${w.final}. ${nm} felt very sorry to see this. How could ${nm} help?`;

  return {text, cause, word, choices, scene, ending:n === TOTAL - 1, moral, questions, title:n === 0 ? `${nm} ${w.title}` : "", src:"offline"};

    (c.picked ? (en ? `\nThe child's choice: ` : `\nÇocuğun seçimi: `) + c.picked.label + (c.picked.kind === "custom" ? (en ? " (the child's own idea)" : " (çocuğun kendi fikri)") : "") : "")).join("\n\n");
  if (en){
    const stage = ["opening: introduce the hero and reveal a problem that needs solving",
      "journey: show the result of the child's choice, then an obstacle appears on the way",
      "the obstacle is overcome and the goal is reached, but one last small problem appears",
      "ending: the problem is solved thanks to the child's choices, a happy ending and a short lesson"][n];
    return `You are a warm, cheerful storyteller who writes interactive stories for children. You are writing in English for a child aged ${A.label.replace("Ages ", "")}.

- NO scary, violent, sad or grown-up content. Instead of a villain there is a problem to solve; problems are solved with friendship, cleverness, teamwork and kindness.
- Language: ${A.rule}. Classic fairy-tale voice in the past tense. The first chapter starts with "Once upon a time".
- If the child's own idea is unsuitable or makes no sense, gently turn it into something positive that fits the story.
- There are ${TOTAL} chapters in total. Write chapter ${n + 1} now. This chapter's job: ${stage}.
${n > 0 ? `- This chapter must begin as the DIRECT RESULT of the child's last choice ("${picked ? picked.label : ""}").` : ""}

${past ? "The story so far:\n" + past + "\n" : ""}
Reply with only this JSON object:
{${n === 0 ? `"title": "a short title for the story",` : ""}
"text": "the chapter text, paragraphs separated by \\n\\n",
"cause": "${n === 0 ? "leave empty" : "one sentence in the form 'You chose ... So ...' linking the choice to its result"}",
"word": {"w": "a word from this chapter that may be new to the child", "m": "a short meaning a child can understand"},
"scene": "2-3 emoji that show this chapter",
"choices": ${ending ? "[]" : `[{"e": "one emoji", "label": "a choice of at most 6 words"}, ... exactly 3, each leading somewhere different]`}${ending ? `,
"moral": "the story's lesson in one sentence",
"questions": ["3 short questions to ask the child about the story; one should be about cause and effect"]` : ""}}`;
  }
  const stage = ["giriş: kahramanı tanıt ve çözülmesi gereken bir sorun ortaya çıksın",
    "yolculuk: çocuğun seçiminin sonucu yaşansın, sonra yolda bir engel çıksın",
    "engel aşılır, hedefe varılır ama son küçük bir sorun belirir",
    "son: sorun çocuğun seçimleri sayesinde çözülsün, mutlu son ve kısa bir ders"][n];
  return `Sen çocuklar için interaktif masal yazan, sıcak ve neşeli bir Türk masalcısısın. ${A.label} bir çocuk için Türkçe yazıyorsun.

Kahraman: ${h.name}, ${traitText(h.traits, "tr")}, ${h.colorAdj} renkli bir ${h.noun}. Süper gücü: ${P.label.toLocaleLowerCase("tr")}.
Masal dünyası: ${w.label} (${w.desc}).

Kurallar:
- Korkutucu, şiddet içeren, üzücü ya da yetişkin içerikli öğe YOK. Kötü karakter yerine çözülmesi gereken bir sorun var; sorunlar dostluk, zekâ, yardımlaşma ve iyilikle çözülür.
- Dil: ${A.rule}. Geleneksel masal anlatımı (-mış'lı geçmiş zaman). İlk bölüm "Bir varmış bir yokmuş" ile başlasın.
- Çocuğun kendi fikri uygunsuz ya da anlamsızsa onu nazikçe masala uygun, olumlu bir hale getir.
- Toplam ${TOTAL} bölüm var. Şimdi ${n + 1}. bölümü yaz. Bu bölümün görevi: ${stage}.
${n > 0 ? `- Bu bölüm, çocuğun son seçiminin ("${picked ? picked.label : ""}") DOĞRUDAN SONUCU olarak başlamalı.` : ""}

${past ? "Şimdiye kadarki masal:\n" + past + "\n" : ""}

{${n === 0 ? `"title": "masalın kısa adı",` : ""}

function cleanAI(o, n, st){
  if (!o || typeof o.text !== "string" || o.text.trim().length < 30) return null;
  const ending = n === TOTAL - 1;
  const choices = Array.isArray(o.choices) ? o.choices.filter(c => c && c.label).slice(0, 3)
    .map(c => ({e:emo(c.e, "✨"), label:String(c.label).slice(0, 70), kind:"ai"})) : [];
  if (!ending && choices.length < 2) return null;
  const scene = Array.from(String(o.scene || "")).filter(ch => /\p{Extended_Pictographic}/u.test(ch)).slice(0, 3);
  return {
    text:o.text.trim(), cause:n === 0 ? "" : String(o.cause || ""), title:String(o.title || ""),
    word:o.word && o.word.w ? {w:String(o.word.w), m:String(o.word.m || "")} : null,
    scene:[st.hero.e, ...scene.filter(e => e !== st.hero.e)].slice(0, 3),
    choices:ending ? [] : choices, ending, src:"ai",
    moral:String(o.moral || ""), questions:Array.isArray(o.questions) ? o.questions.slice(0, 3).map(String) : []
  };
}
function aiError(e){
  const c = e && e.code;
  if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","session_expired"].includes(c)){
    aiState = "off"; toast(T().tNoAI);
  } else if (c === "rate_limited") toast(T().tRate);
  else toast(T().tNet);
}

function heroSnap(d, lang){
  const H = HEROES[d.hero], HL = H[lang];
  let noun = HL.noun;
  if (d.hero === "ozel"){
    noun = d.custom.trim().replace(/\s+/g, " ");
    noun = lang === "en" ? noun.toLowerCase().replace(/^(a|an|the)\s+/, "") : lower(noun).replace(/^bir\s+/, "");
    noun = noun || (lang === "en" ? "hero" : "kahraman");
  }
  return {id:d.hero, e:H.e, noun, name:cap(d.name.trim()).slice(0, 20) || HL.def,
    traits:d.traits.slice(0, 2).map(k => TRAITS[k][lang]), traitKeys:d.traits.slice(0, 2), power:d.power,
    color:d.color, colorAdj:COLORS[d.color][lang], colorV:COLORS[d.color].v, world:d.world, age:d.age};
}
async function startStory(){
  S.story = {id:"m" + Date.now(), lang:S.lang, created:Date.now(), hero:heroSnap(S.draft, S.lang), chapters:[], ended:false, title:""};
  S.readOnly = false; S.screen = "story"; window.scrollTo(0, 0);
  await makeChapter(null);
}
async function makeChapter(picked){
  const st = S.story, n = st.chapters.length, msgs = LOADING[st.lang];
  S.busy = true; S.loadMsg = msgs[Math.floor(Math.random() * msgs.length)];
  render(); requestAnimationFrame(() => { const l = $("#loading"); if (l && n) l.scrollIntoView({behavior:"smooth", block:"center"}); });
  let ch = null;
  if (useAI()){
    S.ctl = new AbortController();
    try {
      const o = await sample.json(aiPrompt(st, n, picked), {modelTier:"quick", signal:S.ctl.signal, cache:false});
      ch = cleanAI(o, n, st);
      if (!ch) toast(T().tBad);
    } catch (e){
      if (e && e.code === "cancelled"){
        S.busy = false; S.ctl = null;
        if (n === 0){ S.story = null; S.screen = "world"; } else st.chapters[n - 1].picked = null;
        render(); return;
      }
      aiError(e);
    }
    S.ctl = null;
  }
  if (S.story !== st) return;
  if (!ch) ch = offlineChapter(st, n, picked);
  if (!ch.ending && S.puzzles) ch.puzzle = makePuzzle(st, ch);
  st.chapters.push(ch);
  if (n === 0) st.title = ch.title || offlineChapter(st, 0, null).title;
  if (ch.ending){ st.ended = true; st.moral = ch.moral; st.questions = ch.questions; saveStory(st); }
  S.busy = false; render();
  requestAnimationFrame(() => { const el = document.getElementById("ch" + n); if (el && n) el.scrollIntoView({behavior:"smooth", block:"start"}); });
  if (S.autoRead) speak(ch.text, n);
}
function pick(choice){
  const st = S.story; if (!st || S.busy || st.ended) return;
  stopSpeak();
  const last = st.chapters[st.chapters.length - 1];
  if (last.puzzle) delete last.puzzle.fresh;
  last.picked = choice;
  makeChapter(choice);
}
function sendIdea(text){
  const t = String(text || "").replace(/\s+/g, " ").trim().slice(0, 120);
  if (t.length < 2){ toast(T().tIdea); return; }
  pick({e:"💭", label:t, kind:"custom"});
}
function saveStory(st){
  S.library = [st, ...S.library.filter(s => s.id !== st.id)].slice(0, 30);
  store.set(LIB, S.library);
}
function exampleStory(lang){
  const d = {hero:"kedi", custom:"", name:HEROES.kedi[lang].def, traits:["merakli","nazik"], power:"uc", color:"mor", world:"uzay", age:"6-8"};
  const st = {id:"ornek-" + lang, lang, example:true, created:0, ended:true, chapters:[], hero:heroSnap(d, lang)};
  const path = ["ask", "friends", "share"];
  for (let n = 0; n < TOTAL; n++){
    const prev = n ? st.chapters[n - 1].choices.find(c => c.kind === path[n - 1]) : null;
    if (n) st.chapters[n - 1].picked = prev;
    st.chapters.push(offlineChapter(st, n, prev));
  }
  st.title = st.chapters[0].title; st.moral = st.chapters[3].moral; st.questions = st.chapters[3].questions;
  return st;
}

const PZ_ACT = {
  pzopt(b){ const p = curPz(); if (!p) return; const i = +b.dataset.i;
    if (i === p.ans) return pzSolve(p);
    if (!p.wrong.includes(i)){ p.wrong.push(i); p.tries++; } pzRefresh(); },
  pzcard(b){ const p = curPz(); if (!p || p.lock) return; const i = +b.dataset.i;
    if (p.up.includes(i) || p.done.includes(i)) return;
    p.up.push(i);
    if (p.up.length === 2){
      const [x, y] = p.up;
      if (p.cards[x] === p.cards[y]){ p.done.push(x, y); p.up = []; if (p.done.length === p.cards.length) return pzSolve(p); }
      else { p.tries++; p.lock = true; setTimeout(() => { p.up = []; p.lock = false; pzRefresh(); }, 850); }
    }
    pzRefresh(); },
  pzseq(b){ const p = curPz(); if (!p) return; const i = +b.dataset.i;
    if (p.order[i] === p.got){ p.got++; p.bad = null; if (p.got === p.steps.length) return pzSolve(p); }
    else { p.tries++; p.bad = i; }
    pzRefresh(); },
  pztile(b){ const p = curPz(); if (!p) return; const i = +b.dataset.i;
    if (p.used.includes(i)) return;
    if (p.tiles[i] === p.word[p.used.length]){ p.used.push(i); p.bad = null; if (p.used.length === p.word.length) return pzSolve(p); }

const synth = window.speechSynthesis;
let speaking = null;
function stopSpeak(){ if (synth) synth.cancel(); speaking = null; markSpeak(); }
function speak(text, i){
  if (!synth || !window.SpeechSynthesisUtterance){ toast(T().tNoTTS); return; }
  synth.cancel();
  const code = T().speech, u = new SpeechSynthesisUtterance(String(text).replace(/\n+/g, " "));
  u.lang = code; u.rate = .9; u.pitch = 1.1;
  const voices = synth.getVoices();
  const v = voices.find(v => v.lang.replace("_", "-") === code) || voices.find(v => v.lang.slice(0, 2) === code.slice(0, 2));
  if (v) u.voice = v;
  u.onend = u.onerror = () => { if (speaking === i){ speaking = null; markSpeak(); } };
  speaking = i; markSpeak(); synth.speak(u);
}
function markSpeak(){
  document.querySelectorAll('[data-act="speak"]').forEach(b => {
    const on = String(speaking) === b.dataset.i;
    b.textContent = on ? T().stop : T().listen; b.setAttribute("aria-pressed", on);
  });
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micOk = !!SR, rec = null;
function listen(target){
  if (!micOk){ toast(T().tMicOff); return; }
  if (rec){ try { rec.abort(); } catch {} rec = null; S.listening = null; markMic(); return; }
  try { rec = new SR(); } catch { micOk = false; render(); return; }
  rec.lang = T().speech; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => onHeard(target, e.results[0][0].transcript);
  rec.onerror = e => {
    if (["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){ micOk = false; render(); toast(T().tMicDenied); }
    else if (e.error === "no-speech") toast(T().tNoSpeech);
  };
  rec.onend = () => { rec = null; S.listening = null; markMic(); };
  S.listening = target; markMic();
  try { rec.start(); } catch { rec = null; S.listening = null; markMic(); }
}
function markMic(){ document.querySelectorAll('[data-act="mic"]').forEach(b => b.classList.toggle("listening", S.listening === b.dataset.t)); }
const norm = s => lower(s).replace(/[^a-zçğıöşü0-9 ]/g, " ").replace(/\s+/g, " ").trim();
function matchChoice(said, choices){
  const s = norm(said), words = s.split(" "); let best = -1, score = 0;
  choices.forEach((c, i) => {
    const hit = norm(c.label).split(" ").filter(w => w.length > 2).filter(w => s.includes(w.slice(0, Math.max(3, w.length - 2)))).length;
    if (hit > score){ score = hit; best = i; }
  });
  if (score) return best;
  if (words.length <= 3){
    const ord = T().ordinals;
    for (let i = 0; i < choices.length; i++) if (ord[i].some(o => words.includes(o))) return i;
  }
  return -1;
}
function onHeard(target, said){
  if (target === "name"){
    const nm = cap(said.trim().split(" ")[0] || "");
    S.draft.name = nm; const el = $("#heroName"); if (el) el.value = nm;
  } else if (target === "custom"){
    S.draft.custom = said; const el = $("#customHero"); if (el) el.value = said; renderBar();
  } else if (target === "idea"){
    const st = S.story, ch = st && st.chapters[st.chapters.length - 1];
    if (!ch) return;
    const i = matchChoice(said, ch.choices);
    if (i >= 0){ toast(T().tHeard(said, ch.choices[i].label)); pick(ch.choices[i]); }
    else { const el = $("#idea"); if (el) el.value = said; toast(T().tHeardIdea(said)); }
  }
}

    </div>
    ${c.cause ? `<div class="cause"><span class="label">${t.cause}</span><p>${esc(c.cause)}</p></div>` : ""}
    <div class="read">${c.text.split(/\n{2,}/).map(p => `<p>${esc(p)}</p>`).join("")}</div>
    <div class="chapter-tools">
      <button class="btn ghost sm" data-act="speak" data-i="${i}" aria-pressed="false">${t.listen}</button>
    </div>
    ${c.word ? `<div class="word"><span class="label">${t.newWord}</span><b>${esc(c.word.w)}</b><span>${esc(c.word.m)}</span></div>` : ""}
    ${S.readOnly || i < st.chapters.length - 1 ? pzChip(c) : ""}
  </article>`;
}
function endHTML(st){
  const t = T();
  return `<section class="end">
    <span class="label">${t.theEnd}</span>
    ${st.moral ? `<p class="moral">${esc(st.moral)}</p>` : ""}
    ${st.questions && st.questions.length ? `<div class="section"><span class="label">${t.talk}</span><ol>${st.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ol></div>` : ""}
    ${pzStars(st)}
    <p class="hint">${st.example ? t.exampleNote : t.savedNote}</p>
    <div class="row">
      <button class="btn" data-act="new">${t.newStory}</button>
      ${st.example ? "" : `<button class="btn ghost" data-act="again">${esc(t.again(st.hero.name))}</button>`}
    </div>
  </section>`;
}
const micBtn = id => micOk ? `<button class="btn ghost icon" data-act="mic" data-t="${id}" aria-label="${T().micAria}">🎤</button>` : "";
const micHint = () => micOk ? "" : `<p class="hint">${T().keyboardMic}</p>`;

function renderBar(){
  const t = T(), d = S.draft, bar = $("#bar"); let html = "";
  if (S.screen === "hero"){
    const ok = d.hero && (d.hero !== "ozel" || d.custom.trim());
    html = `${ok ? "" : `<p class="why">${d.hero === "ozel" ? t.whyCustom : t.whyHero}</p>`}<div class="row"><button class="btn ghost" data-act="home">${t.back}</button><button class="btn" data-act="go" data-v="traits" ${ok ? "" : "disabled"}>${t.next}</button></div>`;
  } else if (S.screen === "traits"){
    html = `<div class="row"><button class="btn ghost" data-act="go" data-v="hero">${t.back}</button><button class="btn" data-act="go" data-v="world">${t.next}</button></div>`;
  } else if (S.screen === "world"){
    html = `${d.world ? "" : `<p class="why">${t.whyWorld}</p>`}<div class="row"><button class="btn ghost" data-act="go" data-v="traits">${t.back}</button><button class="btn" data-act="start" ${d.world ? "" : "disabled"}>${t.start}</button></div>`;
  }
  bar.hidden = !html; $("#barIn").innerHTML = html;
  $("#main").classList.toggle("nobar", !html);
}
function render(){
  document.documentElement.lang = L(); document.title = T().docTitle;
  renderHead(); $("#main").innerHTML = V[S.screen](); renderBar(); markSpeak(); markMic();
}

/* ---------- olaylar ---------- */
function go(screen){ stopSpeak(); S.screen = screen; render(); window.scrollTo(0, 0); }
const A = {
  home(){ if (S.ctl) S.ctl.abort(); S.readOnly = false; S.confirmDel = null; go("home"); },
  shelf(){ A.home(); requestAnimationFrame(() => $("#kitaplik").scrollIntoView({behavior:"smooth"})); },
  lang(b){ S.lang = b.dataset.v; store.set("masal-dil", S.lang); render(); },
  new(){ S.draft = freshDraft(); S.story = null; S.readOnly = false; go("hero"); },
  hero(b){
    const d = S.draft, olds = d.hero ? [HEROES[d.hero].tr.def, HEROES[d.hero].en.def] : [];
    d.hero = b.dataset.v;
    if (!d.name || olds.includes(d.name)) d.name = HEROES[d.hero][S.lang].def;
    render();
  },
  go(b){ go(b.dataset.v); },
  trait(b){
    const t = S.draft.traits, v = b.dataset.v, i = t.indexOf(v);
    if (i >= 0) t.splice(i, 1); else { if (t.length >= 2) t.shift(); t.push(v); }
    render();
  },
  power(b){ S.draft.power = b.dataset.v; render(); },
  color(b){ S.draft.color = b.dataset.v; render(); },
  world(b){ S.draft.world = b.dataset.v; render(); },
  age(b){ S.draft.age = b.dataset.v; render(); },
  dice(){ const list = NAMES[S.lang], cur = S.draft.name; let n = cur; while (n === cur) n = list[Math.floor(Math.random() * list.length)]; S.draft.name = n; $("#heroName").value = n; },
  start(){ if (S.draft.world) startStory(); },
  choose(b){ const st = S.story, ch = st.chapters[st.chapters.length - 1]; pick(ch.choices[+b.dataset.i]); },
  idea(){ sendIdea($("#idea").value); },
  mic(b){ listen(b.dataset.t); },
  speak(b){ const i = +b.dataset.i; if (speaking === i) stopSpeak(); else speak(S.story.chapters[i].text, i); },
  auto(){ S.autoRead = !S.autoRead; store.set("masal-oto-oku", S.autoRead); if (!S.autoRead) stopSpeak(); render(); },
  cancel(){ if (S.ctl) S.ctl.abort(); },
  engine(b){ S.engine = b.dataset.v; store.set("masal-motor", S.engine); render(); },
  open(b){
    const id = b.dataset.id;
    S.story = id.startsWith("ornek") ? EXAMPLES[id.slice(6)] : S.library.find(s => s.id === id);
    if (!S.story) return;
    S.readOnly = true; S.confirmDel = null; go("story");
  },
  del(b){
    const id = b.dataset.id;
    if (S.confirmDel !== id){ S.confirmDel = id; render(); return; }
    S.library = S.library.filter(s => s.id !== id); store.set(LIB, S.library); S.confirmDel = null; render(); toast(T().deleted);
  },
  again(){
    const h = S.story.hero, lang = S.story.lang || "tr";
    const keys = h.traitKeys || Object.keys(TRAITS).filter(k => (h.traits || []).includes(TRAITS[k][lang]));
    const color = COLORS[h.color] ? h.color : (Object.keys(COLORS).find(k => COLORS[k].tr === h.color) || "mor");
    S.lang = lang; store.set("masal-dil", lang);
    S.draft = {hero:h.id, custom:h.id === "ozel" ? h.noun : "", name:h.name, traits:keys, power:h.power, color, world:null, age:h.age};
    S.story = null; S.readOnly = false; go("world");
  }
};
Object.assign(A, PZ_ACT);
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  if (S.confirmDel && b.dataset.act !== "del") S.confirmDel = null;
  const f = A[b.dataset.act]; if (f) f(b);
});
document.addEventListener("input", e => {
  if (e.target.id === "heroName") S.draft.name = e.target.value;
  if (e.target.id === "customHero"){ const had = !!S.draft.custom.trim(); S.draft.custom = e.target.value; if (had !== !!e.target.value.trim()) renderBar(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "idea"){ e.preventDefault(); sendIdea(e.target.value); }
  if (e.key === "Enter" && (e.target.id === "heroName" || e.target.id === "customHero")) e.target.blur();
});
if (synth && synth.onvoiceschanged !== undefined) synth.onvoiceschanged = () => {};

try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({screen:S.screen, draft:S.draft, story:S.busy ? null : S.story, readOnly:S.readOnly})); } catch {}
function boot(data){
  if (data && data.screen){
    S.draft = Object.assign(freshDraft(), data.draft || {});
    S.draft.traits = (S.draft.traits || []).filter(k => TRAITS[k]);
    if (!COLORS[S.draft.color]) S.draft.color = "mor"; S.story = data.story || null; S.readOnly = !!data.readOnly;
    S.screen = data.screen === "story" && !S.story ? "home" : data.screen;
  }
  render();
}
const hot = window.claude && window.claude.hot;
hot && hot.ready ? hot.ready(boot) : boot(hot && hot.data ? hot.data : {});
</script>
</body></html>
