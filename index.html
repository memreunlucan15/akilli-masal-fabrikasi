<title>Akıllı Masal Fabrikası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one narrow column like a picture book; a toy-like sticky action bar at the bottom of each wizard step. */
:root{
  --bg:#EEF1FB; --surface:#FFFFFF; --ink:#221F45; --muted:#5E5987; --line:#D8DAF0;
  --accent:#FF7A30; --accent-deep:#D2581A; --accent-ink:#FFFFFF; --accent-soft:#FFE7D7;
  --leaf:#178F75; --leaf-soft:#DDF4EC; --sun:#FFC928; --sun-soft:#FFF2C2; --sky:#4B63F0;
  --chip-on:#221F45; --chip-on-ink:#FFFFFF; --danger:#C8323C;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-read:"Andika","Nunito",system-ui,sans-serif;
  --r-lg:24px; --r-md:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#13132B; --surface:#1F1E42; --ink:#F2EFFF; --muted:#ADA8D8; --line:#363463;
  --accent:#FF8C4A; --accent-deep:#B5501A; --accent-ink:#1B1030; --accent-soft:#3D2A3A;
  --leaf:#4FD1B0; --leaf-soft:#173A36; --sun:#FFD248; --sun-soft:#3A3418; --sky:#8C9BFF;
  --chip-on:#FFD248; --chip-on-ink:#1B1030; --danger:#FF6B74; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#13132B; --surface:#1F1E42; --ink:#F2EFFF; --muted:#ADA8D8; --line:#363463;
  --accent:#FF8C4A; --accent-deep:#B5501A; --accent-ink:#1B1030; --accent-soft:#3D2A3A;
  --leaf:#4FD1B0; --leaf-soft:#173A36; --sun:#FFD248; --sun-soft:#3A3418; --sky:#8C9BFF;
  --chip-on:#FFD248; --chip-on-ink:#1B1030; --danger:#FF6B74; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);line-height:1.1;margin:0;text-wrap:balance}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;font-family:var(--font-display);font-weight:800;font-size:1.15rem;white-space:nowrap;min-width:0}
@media (max-width:420px){ .top-actions .pill{display:none} }
.brand .gear{display:inline-block;font-size:1.3rem}
.top-actions{display:flex;gap:8px;align-items:center}
.pill{font-size:.75rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--surface);border:2px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ai{border-color:var(--leaf);color:var(--leaf)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-bottom:10px}
.step{display:flex;flex-direction:column;gap:4px;font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.03em}
.step i{display:block;height:8px;border-radius:99px;background:var(--line)}
.step.on{color:var(--ink)} .step.on i{background:var(--accent)}
.step.done i{background:var(--leaf)}

main{padding-block:8px 140px}
main.nobar{padding-bottom:48px}
.screen{display:flex;flex-direction:column;gap:22px}
.lead h1{font-size:clamp(1.8rem,7vw,2.3rem)}
.lead p{margin:6px 0 0;color:var(--muted);font-size:1.02rem}
.section{display:flex;flex-direction:column;gap:10px}
.section h2{font-size:1.3rem}
.label{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-md);padding:14px 22px;font-family:var(--font-display);font-weight:700;font-size:1.15rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s;min-height:54px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active{box-shadow:0 1px 0 var(--line)}
.btn.sm{min-height:42px;padding:8px 14px;font-size:1rem;border-radius:14px}
.btn.wide{width:100%}
.btn.icon{min-width:54px;padding:0 12px;font-size:1.4rem}
.btn.listening{background:var(--danger);box-shadow:0 4px 0 var(--accent-deep);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}

/* picks */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.grid2.worlds{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pick{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px 12px;border-radius:var(--r-lg);border:3px solid var(--line);background:var(--surface);text-align:center;font-weight:800;font-size:.95rem;line-height:1.2;min-width:0}
.pick .em{font-size:2.6rem;line-height:1.1}
.pick small{display:block;font-weight:600;color:var(--muted);font-size:.78rem}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.8rem;display:grid;place-items:center}
.world .em{font-size:2.2rem}
.world{padding:12px 8px;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:800;font-size:.98rem;min-height:44px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.sw{width:48px;height:48px;border-radius:50%;border:4px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.field{display:flex;gap:8px;align-items:stretch}
.field input{flex:1;min-width:0;border:3px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;font-size:1.15rem;font-weight:700}
.field input:focus{border-color:var(--sky);outline:none}
.hint{font-size:.88rem;color:var(--muted);margin:0}

/* action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.bar .row{display:flex;gap:10px;align-items:center}
.bar .row .btn:last-child{flex:1}
.bar .why{font-size:.85rem;color:var(--muted);margin:0 0 8px;text-align:center}

/* home */
.factory{position:relative;overflow:hidden;border-radius:28px;background:var(--surface);border:3px solid var(--line);padding:22px 18px 0;display:flex;flex-direction:column;gap:10px}
.factory h1{font-size:clamp(2.1rem,9vw,2.9rem);letter-spacing:-.01em}
.factory h1 span{color:var(--accent)}
.factory p{margin:0;color:var(--muted);font-size:1.05rem;max-width:34ch}
.factory .btn{align-self:flex-start;margin-top:6px}
.belt{position:relative;margin:14px -18px 0;height:92px;border-top:3px dashed var(--line);overflow:hidden}
.belt-track{position:absolute;bottom:22px;display:flex;gap:28px;font-size:2.4rem;white-space:nowrap;animation:belt 18s linear infinite}
.belt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 26px);animation:roll 1.2s linear infinite}
.belt .book{position:absolute;right:12px;bottom:20px;font-size:2.8rem;z-index:2;filter:drop-shadow(-12px 0 10px var(--surface))}
@keyframes belt{from{transform:translateX(-50%)}to{transform:translateX(0)}}
@keyframes roll{from{background-position:0 0}to{background-position:26px 0}}
.spin{display:inline-block;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.shelf{display:flex;flex-direction:column;gap:10px}
.book-card{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.book-card .cover{width:54px;height:54px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:1.9rem}
.book-card .meta{flex:1;min-width:0}
.book-card b{display:block;font-family:var(--font-display);font-size:1.08rem;line-height:1.2}
.book-card span{font-size:.85rem;color:var(--muted)}
.book-card .open{background:none;border:0;padding:0;text-align:left;display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--sun-soft);color:var(--ink);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.del{background:none;border:0;color:var(--muted);font-weight:800;font-size:.85rem;padding:8px;border-radius:10px;white-space:nowrap}
.del.sure{color:var(--danger);background:var(--accent-soft)}
.empty{border:2px dashed var(--line);border-radius:var(--r-md);padding:16px;color:var(--muted);text-align:center;margin:0}

.parents{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.parents ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.parents li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.parents li b{display:block}
.parents li span{color:var(--muted);font-size:.93rem}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px}

/* story */
.story-head{display:flex;flex-direction:column;gap:6px}
.story-head h1{font-size:clamp(1.7rem,7vw,2.3rem)}
.story-head .sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 12px;min-height:40px}
.toggle[aria-pressed="true"]{border-color:var(--leaf);color:var(--leaf)}
.chapter{display:flex;flex-direction:column;gap:14px;scroll-margin-top:130px}
.scene{position:relative;aspect-ratio:16/8;max-width:100%;border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,26px);overflow:hidden}
.scene .e{font-size:clamp(2.6rem,13vw,4.2rem);line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.scene .e.hero{animation:bob 3s ease-in-out infinite}
.scene .glow{position:absolute;width:44%;aspect-ratio:1;border-radius:50%;opacity:.45;filter:blur(24px)}
@keyframes bob{50%{transform:translateY(-8px)}}
.scene .num{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--ink);font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.picked{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;background:var(--chip-on);color:var(--chip-on-ink);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.92rem}
.cause{border:2px dashed var(--leaf);background:var(--leaf-soft);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.cause .label{color:var(--leaf)}
.cause p{margin:0;font-weight:700}
.read{font-family:var(--font-read);font-size:1.24rem;line-height:1.75;max-width:62ch}
.read p{margin:0 0 .8em}
.read p:last-child{margin-bottom:0}
.chapter-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.word{display:flex;flex-direction:column;gap:2px;background:var(--sun-soft);border-radius:var(--r-md);padding:10px 14px}
.word b{font-family:var(--font-display);font-size:1.2rem}
.word span{font-size:.95rem}
.divider{height:0;border-top:3px dotted var(--line);margin:6px 0}

.ask{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:3px solid var(--line);border-radius:var(--r-lg);padding:16px}
.ask h2{font-size:1.35rem}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:grid;grid-template-columns:34px 44px 1fr;align-items:center;gap:6px;text-align:left;background:var(--bg);border:3px solid var(--line);border-radius:var(--r-md);padding:10px 12px;font-family:var(--font-display);font-weight:700;font-size:1.12rem;line-height:1.2;box-shadow:0 4px 0 var(--line);min-height:64px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.choice .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.9rem}
.choice .ce{font-size:1.9rem}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:.85rem}
.or::before,.or::after{content:"";flex:1;border-top:2px solid var(--line)}

.loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 16px;background:var(--surface);border:3px dashed var(--line);border-radius:var(--r-lg);text-align:center}
.gears{font-size:2.6rem;display:flex;gap:2px}
.gears span:nth-child(2){animation-direction:reverse;font-size:1.8rem;margin-top:22px}
.loading p{margin:0;font-weight:800;font-family:var(--font-display);font-size:1.15rem}

.end{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:3px solid var(--accent);border-radius:var(--r-lg);padding:18px}
.end .moral{font-family:var(--font-display);font-size:1.35rem;font-weight:700;line-height:1.25;margin:0}
.end ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:1.05rem}
.end .row{display:flex;flex-wrap:wrap;gap:10px}
.end .row .btn{flex:1 1 200px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;max-width:min(92vw,460px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;font-size:.95rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<header class="top"><div class="wrap" id="head"></div></header>
<main class="wrap" id="main"></main>
<div class="bar" id="bar" hidden><div class="wrap" id="barIn"></div></div>

const VOW = "aeıioöuü";

function lastV(w){ const l = lower(w); for (let i = l.length - 1; i >= 0; i--) if (VOW.includes(l[i])) return l[i]; return "e"; }
const endsV = w => VOW.includes(lower(w).slice(-1));
const four = v => ({a:"ı",ı:"ı",o:"u",u:"u",e:"i",i:"i",ö:"ü",ü:"ü"})[v];
const two = v => "aıou".includes(v) ? "a" : "e";
const gen = n => n + "'" + (endsV(n) ? "n" : "") + four(lastV(n)) + "n";
const dat = n => n + "'" + (endsV(n) ? "y" : "") + two(lastV(n));
const cap = s => s ? s.charAt(0).toLocaleUpperCase("tr") + s.slice(1) : s;
function traitText(t){ if (!t.length) return "neşeli"; return t.length === 1 ? t[0] : t[0] + " ve " + t[1]; }

        `Sen hemen yola çıkmayı seçtin. ${nm} cesurca harekete geçtiği için yolda yeni bir yardımcı buldu.`, {w:"cesaret", m:"Biraz korksak bile doğru olanı yapabilmek."}],

        `Sen plan yapmayı seçtin. ${nm} sakin kalıp düşündüğü için çözümü buldu.`, {w:"plan", m:"Bir işi nasıl yapacağımızı önceden düşünmek."}],

    }[kind] || [`${nm} engeli dikkatlice aşmış.`, "", {w:"engel", m:"Yolumuzu kesen, aşmamız gereken şey."}];
    text = P2[0] + `\n\nSonunda ${w.goalDat} varmış. Ama orada ${w.final}. ${nm} onu öyle görünce çok üzülmüş. Ona nasıl yardım etmeliymiş?`;

      custom:[`${nm} senin fikrini denemiş: "${idea}". Minik dostu buna öyle sevinmiş ki kahkahalarla gülmüş.`,

    cause = P3[1]; word = P3[2]; moral = P3[3];

  return {text, cause, word, choices, scene, ending:n === TOTAL - 1, moral, questions,

/* ---------- Claude ile masal ---------- */
function aiPrompt(st, n, picked){
  const h = st.hero, w = WORLDS[h.world], P = POWERS[h.power] || POWERS.uc;
  const past = st.chapters.map((c, i) => `Bölüm ${i + 1}: ${c.text}` + (c.picked ? `\nÇocuğun seçimi: ${c.picked.label}${c.picked.kind === "custom" ? " (çocuğun kendi fikri)" : ""}` : "")).join("\n\n");
  const ending = n === TOTAL - 1;
  const stage = ["giriş: kahramanı tanıt ve çözülmesi gereken bir sorun ortaya çıksın",
    "yolculuk: çocuğun seçiminin sonucu yaşansın, sonra yolda bir engel çıksın",
    "engel aşılır, hedefe varılır ama son küçük bir sorun belirir",
    "son: sorun çocuğun seçimleri sayesinde çözülsün, mutlu son ve kısa bir ders"][n];
  return `Sen çocuklar için interaktif masal yazan, sıcak ve neşeli bir Türk masalcısısın. ${AGES[h.age].label} bir çocuk için Türkçe yazıyorsun.

Kahraman: ${h.name}, ${traitText(h.traits)}, ${h.colorAdj} renkli bir ${h.noun}. Süper gücü: ${P.label.toLocaleLowerCase("tr")}.
Masal dünyası: ${w.label} (${w.desc}).

Kurallar:
- Korkutucu, şiddet içeren, üzücü ya da yetişkin içerikli öğe YOK. Kötü karakter yerine çözülmesi gereken bir sorun var; sorunlar dostluk, zekâ, yardımlaşma ve iyilikle çözülür.
- Dil: ${AGES[h.age].rule}. Geleneksel masal anlatımı (-mış'lı geçmiş zaman). İlk bölüm "Bir varmış bir yokmuş" ile başlasın.
- Çocuğun kendi fikri uygunsuz ya da anlamsızsa onu nazikçe masala uygun, olumlu bir hale getir.
- Toplam ${TOTAL} bölüm var. Şimdi ${n + 1}. bölümü yaz. Bu bölümün görevi: ${stage}.
${n > 0 ? `- Bu bölüm, çocuğun son seçiminin ("${picked ? picked.label : ""}") DOĞRUDAN SONUCU olarak başlamalı.` : ""}

${past ? "Şimdiye kadarki masal:\n" + past + "\n" : ""}
Yalnızca şu JSON nesnesiyle yanıt ver:
{${n === 0 ? `"title": "masalın kısa adı",` : ""}
"text": "bölüm metni, paragraflar arasında \\n\\n",
"cause": "${n === 0 ? "boş bırak" : "tek cümle: 'Sen ... seçtin. Bu yüzden ...' biçiminde, seçim ile sonucu bağla"}",
"word": {"w": "bölümde geçen, çocuk için yeni olabilecek bir kelime", "m": "çocuğun anlayacağı kısa anlamı"},
"scene": "bölümü anlatan 2-3 emoji",
"choices": ${ending ? "[]" : `[{"e": "tek emoji", "label": "en fazla 6 kelimelik seçenek"}, ... tam 3 tane, birbirinden farklı yönlere giden]`}${ending ? `,
"moral": "masalın tek cümlelik dersi",
"questions": ["çocuğa sorulacak 3 kısa anlama/düşünme sorusu; biri neden-sonuç üzerine olsun"]` : ""}}`;
}
function cleanAI(o, n, st){
  if (!o || typeof o.text !== "string" || o.text.trim().length < 30) return null;
  const ending = n === TOTAL - 1;
  const choices = Array.isArray(o.choices) ? o.choices.filter(c => c && c.label).slice(0, 3)
    .map(c => ({e:emo(c.e, "✨"), label:String(c.label).slice(0, 70), kind:"ai"})) : [];
  if (!ending && choices.length < 2) return null;
  const scene = Array.from(String(o.scene || "")).filter(ch => /\p{Extended_Pictographic}/u.test(ch)).slice(0, 3);
  return {
    text:o.text.trim(), cause:n === 0 ? "" : String(o.cause || ""), title:String(o.title || ""),
    word:o.word && o.word.w ? {w:String(o.word.w), m:String(o.word.m || "")} : null,
    scene:[st.hero.e, ...scene.filter(e => e !== st.hero.e)].slice(0, 3),
    choices:ending ? [] : choices, ending, src:"ai",
    moral:String(o.moral || ""), questions:Array.isArray(o.questions) ? o.questions.slice(0, 3).map(String) : []
  };
}
function aiError(e){
  const c = e && e.code;
  if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","session_expired"].includes(c)){
    aiState = "off"; toast("Claude şu an kullanılamıyor. Masal hazır masal motoruyla devam ediyor.");
  } else if (c === "rate_limited") toast("Claude biraz dinleniyor. Bu bölüm hazır masal motorundan geldi.");
  else toast("Bağlantıda küçük bir sorun oldu. Bu bölüm hazır masal motorundan geldi.");
}

function heroSnap(d){
  const H = HEROES[d.hero];
  return {id:d.hero, e:H.e, noun:d.hero === "ozel" ? (lower(d.custom.trim()) || "kahraman") : H.noun,
    name:cap(d.name.trim()).slice(0, 20) || H.def, traits:d.traits.slice(0, 2), power:d.power,
    color:d.color, colorAdj:d.color, colorV:COLORS[d.color].v, world:d.world, age:d.age};
}
async function startStory(){
  S.story = {id:"m" + Date.now(), created:Date.now(), hero:heroSnap(S.draft), chapters:[], ended:false, title:""};
  S.readOnly = false; S.screen = "story"; window.scrollTo(0, 0);
  await makeChapter(null);
}
async function makeChapter(picked){
  const st = S.story, n = st.chapters.length;
  S.busy = true; S.loadMsg = LOADING[Math.floor(Math.random() * LOADING.length)];
  render(); requestAnimationFrame(() => { const l = $("#loading"); if (l && n) l.scrollIntoView({behavior:"smooth", block:"center"}); });
  let ch = null;
  if (useAI()){
    S.ctl = new AbortController();
    try {
      const o = await sample.json(aiPrompt(st, n, picked), {modelTier:"quick", signal:S.ctl.signal, cache:false});
      ch = cleanAI(o, n, st);
      if (!ch) toast("Claude'un cevabı eksik geldi. Bu bölüm hazır masal motorundan geldi.");
    } catch (e){
      if (e && e.code === "cancelled"){
        S.busy = false;
        if (n === 0){ S.story = null; S.screen = "world"; } else st.chapters[n - 1].picked = null;
        render(); return;
      }
      aiError(e);
    }
    S.ctl = null;
  }
  if (S.story !== st) return;
  if (!ch) ch = offlineChapter(st, n, picked);
  st.chapters.push(ch);
  if (n === 0) st.title = ch.title || offlineChapter(st, 0, null).title;
  if (ch.ending){ st.ended = true; st.moral = ch.moral; st.questions = ch.questions; saveStory(st); }
  S.busy = false; render();
  requestAnimationFrame(() => { const el = document.getElementById("ch" + n); if (el && n) el.scrollIntoView({behavior:"smooth", block:"start"}); });
  if (S.autoRead) speak(ch.text, n);
}
function pick(choice){
  const st = S.story; if (!st || S.busy || st.ended) return;
  stopSpeak();
  st.chapters[st.chapters.length - 1].picked = choice;
  makeChapter(choice);
}

/* ---------- sesli okuma ---------- */
const synth = window.speechSynthesis;
let speaking = null;
function stopSpeak(){ if (synth) synth.cancel(); speaking = null; markSpeak(); }
function speak(text, i){
  if (!synth || !window.SpeechSynthesisUtterance){ toast("Bu cihaz sesli okumayı desteklemiyor."); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/\n+/g, " "));
  u.lang = "tr-TR"; u.rate = .9; u.pitch = 1.1;
  const v = synth.getVoices().find(v => /^tr/i.test(v.lang)); if (v) u.voice = v;
  u.onend = u.onerror = () => { if (speaking === i){ speaking = null; markSpeak(); } };
  speaking = i; markSpeak(); synth.speak(u);
}
function markSpeak(){
  document.querySelectorAll('[data-act="speak"]').forEach(b => {
    const on = String(speaking) === b.dataset.i;
    b.innerHTML = on ? "⏹ Durdur" : "🔊 Dinle"; b.setAttribute("aria-pressed", on);
  });
}

/* ---------- sesli komut ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micOk = !!SR, rec = null;
function listen(target){
  if (!micOk){ toast("Mikrofon burada çalışmıyor. Klavyendeki mikrofon tuşuna basıp konuşarak yazabilirsin."); return; }
  if (rec){ try { rec.abort(); } catch {} rec = null; S.listening = null; markMic(); return; }
  try { rec = new SR(); } catch { micOk = false; render(); return; }
  rec.lang = "tr-TR"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => onHeard(target, e.results[0][0].transcript);
  rec.onerror = e => {
    if (["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){
      micOk = false; render(); toast("Mikrofon izni yok. Klavyendeki mikrofon tuşuna basıp konuşarak da yazabilirsin.");
    } else if (e.error === "no-speech") toast("Seni duyamadım. Bir daha dener misin?");
  };
  rec.onend = () => { rec = null; S.listening = null; markMic(); };
  S.listening = target; markMic();
  try { rec.start(); } catch { rec = null; S.listening = null; markMic(); }
}
function markMic(){ document.querySelectorAll('[data-act="mic"]').forEach(b => b.classList.toggle("listening", S.listening === b.dataset.t)); }
const norm = s => lower(s).replace(/[^a-zçğıöşü0-9 ]/g, " ").replace(/\s+/g, " ").trim();
function matchChoice(said, choices){
  const s = norm(said); let best = -1, score = 0;
  choices.forEach((c, i) => {
    const hit = norm(c.label).split(" ").filter(w => w.length > 2).filter(w => s.includes(w.slice(0, Math.max(3, w.length - 2)))).length;
    if (hit > score){ score = hit; best = i; }
  });
  if (score) return best;
  if (s.split(" ").length <= 3){
    const ord = [["bir","birinci","1","ilk","ilki"],["iki","ikinci","2","ortadaki"],["üç","üçüncü","3","sonuncu"]];
    for (let i = 0; i < choices.length; i++) if (ord[i].some(o => s.split(" ").includes(o))) return i;
  }
  return -1;
}
function onHeard(target, said){
  if (target === "name"){
    const nm = cap(said.trim().split(" ")[0] || "");
    S.draft.name = nm; const el = $("#heroName"); if (el) el.value = nm;
  } else if (target === "custom"){
    S.draft.custom = said; const el = $("#customHero"); if (el) el.value = said;
  } else if (target === "idea"){
    const st = S.story, ch = st && st.chapters[st.chapters.length - 1];
    if (!ch) return;
    const i = matchChoice(said, ch.choices);
    if (i >= 0){ toast(`Duydum: "${said}" → ${ch.choices[i].label}`); pick(ch.choices[i]); }
    else { const el = $("#idea"); if (el) el.value = said; toast(`Duydum: "${said}". Fikrini göndermek için ok tuşuna dokun.`); }
  }
}
